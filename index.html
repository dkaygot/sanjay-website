<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e0e">
    <title>Sanjay Patil — Photography</title>
    <style>
        * {
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        *::-webkit-scrollbar {
            display: none;
        }
        
        html,
        body {
            margin: 0;
            height: 100%;
            background: #0e0e0e;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        
        #stage {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        .page {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 600ms ease, visibility 0s linear 600ms;
            z-index: 1;
            contain: strict;
        }
        
        .page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 2;
            transition: opacity 600ms ease;
        }
        
        .page iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .page,
            .page.active {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div id="stage"></div>

    <script>
        /* ======================================================================
                   ADD YOUR PAGE FILES HERE — each entry is a path to a local .html file,
                   relative to THIS file, with forward slashes ("media-home/lens.html").

                   For auto-advance-on-scroll each page must include oni-bridge.js.
                   Without it a page still displays and arrow keys still work.

                   Loading: only the first page loads straight away. Its neighbours load
                   once it has finished and the browser is idle, and every other page
                   loads just before it is needed — so the opening screen isn't competing
                   with pages nobody has reached yet.
                   ====================================================================== */
        const pages = [{
            src: "media-home/lens.html",
            title: "Home"
        }, {
            src: "Artist/Artist.html",
            title: "Artist"
        }];
        /* ====================================================================== */

        const stage = document.getElementById('stage');
        const idle = window.requestIdleCallback || ((f) => setTimeout(f, 800));

        const slots = pages.map((p, i) => {
            const section = document.createElement('section');
            section.className = 'page';
            const iframe = document.createElement('iframe');
            iframe.title = p.title;
            iframe.setAttribute('allow', 'fullscreen');
            section.appendChild(iframe);
            stage.appendChild(section);
            return {
                section,
                iframe,
                src: p.src,
                requested: false,
                loaded: false,
                pending: null
            };
        });

        function load(i) {
            const slot = slots[i];
            if (!slot || slot.requested) return;
            slot.requested = true;
            slot.iframe.addEventListener('load', () => {
                slot.loaded = true;
                // deliver a "land at top/bottom" command that arrived before the page was ready
                if (slot.pending) {
                    slot.iframe.contentWindow.postMessage(slot.pending, '*');
                    slot.pending = null;
                }
                if (i === current) idle(() => {
                    load(i + 1);
                    load(i - 1);
                });
            }, {
                once: true
            });
            slot.iframe.src = slot.src;
        }

        let current = 0;
        let busy = false;
        const DUR = 600;

        function setActive(i) {
            slots.forEach((s, idx) => s.section.classList.toggle('active', idx === i));
        }

        function goTo(i) {
            if (i < 0 || i >= slots.length || i === current || busy) return;
            busy = true;
            const direction = i > current ? 'forward' : 'backward';
            current = i;
            load(i);
            setActive(i);

            // moving backward lands at the page's bottom, forward at its top
            const msg = {
                source: 'oni-parent',
                type: 'scrollTo',
                position: direction === 'backward' ? 'bottom' : 'top'
            };
            const slot = slots[i];
            if (slot.loaded) {
                slot.iframe.contentWindow.postMessage(msg, '*');
                idle(() => {
                    load(i + 1);
                    load(i - 1);
                });
            } else {
                slot.pending = msg;
            }

            setTimeout(() => busy = false, DUR + 50);
        }

        // edge-of-scroll signals from the child pages
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || data.source !== 'oni-bridge') return;
            // only react to the currently active page
            if (e.source !== slots[current].iframe.contentWindow) return;
            if (data.type === 'navigate') {
                if (data.direction === 'next') goTo(current + 1);
                if (data.direction === 'prev') goTo(current - 1);
            }
        }, false);

        // arrow keys always work, whether or not a page has the bridge script
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                e.preventDefault();
                goTo(current + 1);
            }
            if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault();
                goTo(current - 1);
            }
        });

        load(0);
        setActive(0);
    </script>

</body>

</html>
