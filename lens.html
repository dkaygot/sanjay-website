<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene 0 — Aperture</title>
    <style>
         :root {
            --ink: #060606;
        }
        
        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--ink);
            color: #f2f2f0;
            font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE/Edge */
            overscroll-behavior: none;
            /* stop rubber-band bounce revealing background past page end */
        }
        
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            /* Chrome/Safari/Edge */
            width: 0;
            height: 0;
        }
        
        @media (pointer:fine) {
            body.cursor-ready {
                cursor: none;
            }
        }
        /* ---------- custom cursor ---------- */
        
        .cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 84px;
            height: 84px;
            margin-left: -42px;
            margin-top: -42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            letter-spacing: 0.14em;
            color: #fff;
            pointer-events: none;
            z-index: 999;
            mix-blend-mode: difference;
            transition: width .35s ease, height .35s ease, margin .35s ease, opacity .35s ease;
            opacity: 0;
        }
        
        .cursor.visible {
            opacity: 1;
        }
        
        .cursor .cursor-label {
            transition: opacity .3s ease;
        }
        
        .cursor.scrolled {
            width: 14px;
            height: 14px;
            margin-left: -7px;
            margin-top: -7px;
        }
        
        .cursor.scrolled .cursor-label {
            opacity: 0;
        }
        /* ---------- fixed image, never translates ---------- */
        
        .photo-stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: var(--ink);
        }
        
        .photo-layer {
            position: absolute;
            inset: 0;
            background-image: url('media-home/lens.jpg');
            background-size: cover;
            background-position: center;
            transform-origin: 50% 50%;
            /* aperture sits centre-frame in this image */
            transform: scale(1) rotate(0deg);
            will-change: transform, filter;
        }
        
        .photo-fade {
            position: absolute;
            inset: 0;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            will-change: opacity;
        }
        
        .frame-index {
            position: absolute;
            top: 40px;
            left: 44px;
            font-size: 12px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.55);
            z-index: 2;
        }
        
        .frame-index span {
            color: rgba(255, 255, 255, 0.22);
        }
        
        .wordmark {
            position: absolute;
            left: 50%;
            bottom: 56px;
            transform: translateX(-50%);
            text-align: center;
            z-index: 2;
            will-change: opacity;
        }
        
        .wordmark .name {
            font-size: 14px;
            letter-spacing: 0.22em;
            color: rgba(255, 255, 255, 0.82);
        }
        
        .wordmark .role {
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.42);
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
        }
        
        .aperture-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }
        
        .aperture-text .line {
            font-size: clamp(36px, 7vw, 86px);
            line-height: 1.12;
            letter-spacing: -0.01em;
            color: #f5f4ef;
            white-space: nowrap;
            will-change: transform, opacity;
        }
        
        .aperture-text .line-2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-weight: 400;
            color: rgba(245, 244, 239, 0.88);
        }
        /* ---------- scroll track: purely reserves scroll distance for the zoom ---------- */
        
        .scroll-track {
            position: relative;
            height: 460vh;
            z-index: 0;
        }
        /* ---------- scene 1 : chapter interstitial ---------- */
        
        .scene1 {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            background: #fcfcfc;
            color: #111;
            display: flex;
            align-items: center;
            padding: 0 8vw;
        }
        
        .scene1-inner {
            max-width: 760px;
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 1s cubic-bezier(.2, .7, .2, 1), transform 1s cubic-bezier(.2, .7, .2, 1);
        }
        
        .scene1.in-view .scene1-inner {
            opacity: 1;
            transform: translateY(0);
        }
        
        .scene1-index {
            font-size: 12px;
            letter-spacing: 0.1em;
            color: #b3ada0;
            margin-bottom: 22px;
        }
        
        .scene1-index span {
            color: #dcd7cc;
        }
        
        .scene1-heading {
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.14;
            margin: 0 0 26px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }
        
        .scene1-heading em {
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-weight: 400;
            color: #8a8577;
        }
        
        .scene1-sub {
            font-size: 17px;
            line-height: 1.7;
            max-width: 480px;
            color: #5c574c;
            margin: 0;
        }
        
        .scene1-rule {
            width: 44px;
            height: 1px;
            background: #111;
            margin: 34px 0 0;
        }
        /* ---------- chapter one : image sequence ---------- */
        
        .chapter-track {
            position: relative;
            height: 360vh;
            z-index: 1;
            background: #fcfcfc;
        }
        
        .chapter-stage {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            background: #0c0c0c;
        }
        
        .chapter-img {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            will-change: opacity, transform;
        }
        
        .chapter-img.img-1 {
            background-image: url('media-home/_DSC7809.jpg');
        }
        
        .chapter-img.img-2 {
            background-image: url('media-home/_DSC5849.jpg');
        }
        
        .chapter-img.img-3 {
            background-image: url('media-home/DSC_0583.jpg');
        }
        
        .chapter-scrim {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 34%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
            pointer-events: none;
            z-index: 2;
        }
        
        .chapter-caption {
            position: absolute;
            left: 44px;
            bottom: 40px;
            z-index: 3;
            color: #f5f4ef;
            opacity: 0;
            transition: opacity .5s ease;
            will-change: opacity;
        }
        
        .chapter-caption.active {
            opacity: 1;
        }
        
        .chapter-caption .cap-index {
            font-size: 12px;
            letter-spacing: 0.1em;
            color: rgba(245, 244, 239, 0.6);
            margin-bottom: 8px;
        }
        
        .chapter-caption .cap-title {
            font-size: clamp(22px, 3vw, 32px);
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-weight: 400;
        }
        
        .chapter-progress {
            position: absolute;
            right: 44px;
            bottom: 40px;
            z-index: 3;
            display: flex;
            gap: 8px;
        }
        
        .chapter-progress .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(245, 244, 239, 0.32);
            transition: background .4s ease, transform .4s ease;
        }
        
        .chapter-progress .dot.active {
            background: #f5f4ef;
            transform: scale(1.3);
        }
        
        @media (prefers-reduced-motion: reduce) {
            .photo-layer,
            .photo-fade,
            .cursor {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="cursor" id="cursor"><span class="cursor-label">scroll</span></div>

    <div class="photo-stage">
        <div class="photo-layer" id="photoLayer"></div>
        <div class="photo-fade" id="photoFade"></div>
        <div class="aperture-text" id="apertureText">
            <div class="line line-1" id="line1">See the world</div>
            <div class="line line-2" id="line2">differently.</div>
        </div>
        <div class="wordmark" id="wordmark">
            <div class="name">Sanjay Patil</div>
            <div class="role">photography, field &amp; frame</div>
        </div>
    </div>

    <div class="scroll-track" id="scrollTrack"></div>




    <script>
        (function() {
            var isFinePointer = window.matchMedia('(pointer:fine)').matches;

            var cursor = document.getElementById('cursor');
            if (isFinePointer) {
                document.body.classList.add('cursor-ready');
                cursor.classList.add('visible');
                var mx = 0,
                    my = 0,
                    cx = 0,
                    cy = 0;
                window.addEventListener('mousemove', function(e) {
                    mx = e.clientX;
                    my = e.clientY;
                });
                (function raf() {
                    cx += (mx - cx) * 0.22;
                    cy += (my - cy) * 0.22;
                    cursor.style.transform = 'translate(' + cx + 'px,' + cy + 'px)';
                    requestAnimationFrame(raf);
                })();
                var scrolledOnce = false;
                window.addEventListener('scroll', function() {
                    if (!scrolledOnce) {
                        scrolledOnce = true;
                        cursor.classList.add('scrolled');
                    }
                }, {
                    passive: true
                });
            }

            var track = document.getElementById('scrollTrack');
            var photoLayer = document.getElementById('photoLayer');
            var photoFade = document.getElementById('photoFade');
            var wordmark = document.getElementById('wordmark');
            var line1 = document.getElementById('line1');
            var line2 = document.getElementById('line2');

            function clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            }

            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function update() {
                var rect = track.getBoundingClientRect();
                var total = track.offsetHeight - window.innerHeight;
                var scrolled = clamp(-rect.top, 0, total);
                var p = total > 0 ? scrolled / total : 0; // 0 -> 1

                var scale = 1 + easeInOutCubic(p) * 3.5; // gentler zoom, stretched over more scroll
                var rotate = easeInOutCubic(p) * 32; // rotation grows in step with the zoom
                var brightness = 1 - p * 1; // darkens toward black instead of brightening

                photoLayer.style.transform = 'scale(' + scale + ') rotate(' + rotate + 'deg)';
                photoLayer.style.filter = 'brightness(' + brightness + ')';

                var fadeStart = 0.5;
                var fadeP = clamp((p - fadeStart) / (1 - fadeStart), 0, 1);
                photoFade.style.opacity = String(easeInOutCubic(fadeP));

                wordmark.style.opacity = String(1 - clamp(p / 0.18, 0, 1));

                var textP = easeInOutCubic(clamp(p / 0.22, 0, 1));
                line1.style.transform = 'translateX(-' + (textP * 140) + 'vw)';
                line2.style.transform = 'translateX(' + (textP * 140) + 'vw)';
                line1.style.opacity = String(1 - textP);
                line2.style.opacity = String(1 - textP);
            }

            var ticking = false;

            function onScroll() {
                if (!ticking) {
                    requestAnimationFrame(function() {
                        update();
                        ticking = false;
                    });
                    ticking = true;
                }
            }
            window.addEventListener('scroll', onScroll, {
                passive: true
            });
            window.addEventListener('resize', onScroll);
            update();
        })();
    </script>

    <script src="oni-bridge.js"></script>

</body>

</html>
