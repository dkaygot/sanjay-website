<html lang="en">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"></noscript>

    <style>
        /* Minimal reset (replaces the Tailwind base styles that were loaded before) */
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        
        html {
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }
        
        button {
            font-family: inherit;
        }
        
         :root {
            --bg: #0e0e0f;
            --bg-alt: #151516;
            --card: #1b1b1d;
            --border: #2d2d30;
            --text: #d9d6d0;
            --muted: #9a978f;
            --heading: #f4f1ea;
            --accent: #c9a96a;
            --grid-gap: 2rem;
        }
        /* Hide the page scrollbar but keep scrolling */
        
        html,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* ===== Sleek animated sticky header ===== */
        
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            text-align: center;
            background: var(--bg);
            overflow: hidden;
            box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
            transition: padding 0.3s ease;
        }
        /* Moving gradient: a wide layer slid with transform (runs on the GPU,
           no repainting every frame like animating background-position) */
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 260%;
            z-index: -1;
            background: linear-gradient(120deg, var(--bg), var(--bg-alt), var(--card), var(--bg-alt), var(--bg));
            animation: headerShift 5s ease-in-out infinite alternate;
            will-change: transform;
        }
        
        @keyframes headerShift {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-61.5%);
            }
        }
        /* thin animated light sweep along the header's bottom edge */
        
        header::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
            animation: lineSweep 4s ease-in-out infinite;
            will-change: transform;
        }
        
        @keyframes lineSweep {
            from {
                transform: translateX(-73%);
            }
            to {
                transform: translateX(196%);
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            header::before,
            header::after {
                animation: none;
            }
        }
        /* Tab Navigation Styling */
        
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 2.75rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .tab-btn {
            background: none;
            border: none;
            padding: 0.35rem 0.1rem;
            font-size: 0.76rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--muted);
            position: relative;
            transition: color 0.3s ease;
        }
        
        .tab-btn::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -6px;
            width: 0;
            height: 1px;
            background: var(--accent);
            transform: translateX(-50%);
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .tab-btn:hover {
            color: var(--accent);
        }
        
        .tab-btn:hover::after {
            width: 55%;
        }
        
        .tab-btn.active {
            color: var(--heading);
        }
        
        .tab-btn.active::after {
            width: 100%;
        }
        
        .gallery-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 4.5rem 4rem 4.5rem;
        }
        /* ===== Balanced masonry: explicit columns =====
           Each column is its own flex container, so images stay exactly
           where the precomputed layout puts them (CSS column-count would
           reflow them top-to-bottom and ignore the plan). */
        
        .masonry-grid {
            display: flex;
            align-items: flex-start;
            gap: var(--grid-gap);
            width: 100%;
            transition: opacity 0.4s ease;
        }
        
        .masonry-grid.fading {
            opacity: 0;
        }
        
        .masonry-col {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--grid-gap);
        }
        
        .masonry-item {
            position: relative;
            cursor: pointer;
            overflow: visible;
            /* visible so the image can pop out beyond its box on hover */
            z-index: 1;
            transition: z-index 0.01s;
        }
        
        .masonry-item:hover {
            z-index: 50;
            /* lift above neighboring images while popped out */
        }
        
        .masonry-item img {
            width: 100%;
            height: auto;
            /* width/height attributes reserve the correct space before load */
            display: block;
            object-fit: contain;
            border-radius: 4px;
            background: var(--bg-alt);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center center;
        }
        /* Pop-out effect on hover */
        
        .masonry-item:hover img {
            transform: scale(1.07);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
        }
        /* Responsive Layout Adjustments */
        
        @media (max-width: 1024px) {
             :root {
                --grid-gap: 1.5rem;
            }
            .gallery-container {
                padding: 0 2.5rem 3rem 2.5rem;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 0.85rem 1rem 1rem;
            }
            /* All tabs visible: wrap onto extra lines instead of hiding off-screen */
            .tabs-container {
                flex-wrap: wrap;
                justify-content: center;
                column-gap: 1.75rem;
                row-gap: 0.9rem;
            }
            .tab-btn {
                white-space: nowrap;
            }
        }
        
        @media (max-width: 640px) {
            /* Phone: tidy 3 x 2 grid of tabs */
            .tabs-container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                column-gap: 0.5rem;
                row-gap: 1rem;
                max-width: 420px;
            }
            .tab-btn {
                font-size: 0.7rem;
                letter-spacing: 0.12em;
                padding: 0.45rem 0;
                /* bigger tap target */
                min-height: 2.25rem;
            }
            .tab-btn::after {
                bottom: 2px;
            }
            .tab-btn.active::after {
                width: 70%;
            }
            .tab-btn:hover::after {
                width: 40%;
            }
        }
        
        @media (max-width: 640px) {
            .gallery-container {
                padding: 0 1.5rem 2rem 1.5rem;
            }
        }
        /* ===== End-of-page category switcher ===== */
        
        .category-pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 3rem 0 1rem;
        }
        
        .pager-btn {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            background: none;
            border: none;
            padding: 0;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .pager-btn .pager-arrow {
            width: 2.75rem;
            height: 2.75rem;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--heading);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        
        .pager-btn:hover {
            color: var(--accent);
        }
        
        .pager-btn:hover .pager-arrow {
            background: var(--border);
            border-color: var(--accent);
        }
        
        .pager-btn:focus-visible .pager-arrow {
            outline: 1px solid var(--accent);
            outline-offset: 3px;
        }
        
        .pager-divider {
            width: 1px;
            height: 1.75rem;
            background: var(--border);
        }
        
        @media (max-width: 640px) {
            .category-pager {
                gap: 1rem;
                padding-top: 2.25rem;
            }
            .pager-btn {
                font-size: 0.66rem;
                letter-spacing: 0.1em;
                gap: 0.6rem;
            }
            .pager-btn .pager-arrow {
                width: 2.4rem;
                height: 2.4rem;
            }
        }
        /* ===== Lightbox / enlarge view ===== */
        
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(14, 14, 15, 0.92);
            opacity: 0;
            visibility: hidden;
            padding: 3rem 1.5rem;
            box-sizing: border-box;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        .lightbox-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        
        .lightbox-overlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.96);
            transition: transform 0.3s ease;
            cursor: zoom-out;
        }
        
        .lightbox-overlay.open img {
            transform: scale(1);
        }
        
        .lightbox-close {
            position: absolute;
            top: 1.5rem;
            right: 1.75rem;
            width: 2.5rem;
            height: 2.5rem;
            border: none;
            background: var(--card);
            color: var(--heading);
            font-size: 1.4rem;
            line-height: 1;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        
        .lightbox-close:hover {
            background: var(--border);
            transform: rotate(90deg);
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 2.75rem;
            height: 2.75rem;
            border: none;
            background: var(--card);
            color: var(--heading);
            font-size: 1.4rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease;
        }
        
        .lightbox-nav:hover {
            background: var(--border);
        }
        
        .lightbox-prev {
            left: 1.25rem;
        }
        
        .lightbox-next {
            right: 1.25rem;
        }
        
        @media (max-width: 640px) {
            .lightbox-nav {
                width: 2.25rem;
                height: 2.25rem;
                font-size: 1.1rem;
            }
            .lightbox-close {
                top: 1rem;
                right: 1rem;
            }
        }
        /* ===== Custom circular inverted cursor (desktop / mouse only) ===== */
        
        @media (hover: hover) and (pointer: fine) {
            body,
            a,
            button,
            .tab-btn,
            .masonry-item,
            img,
            .lightbox-close,
            .lightbox-nav {
                cursor: none;
            }
            .custom-cursor {
                position: fixed;
                top: 0;
                left: 0;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: var(--heading);
                mix-blend-mode: difference;
                pointer-events: none;
                z-index: 9999;
                margin: -13px 0 0 -13px;
                will-change: transform;
                opacity: 0;
                transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s cubic-bezier(0.16, 1, 0.3, 1), margin 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
            }
            .custom-cursor.active {
                opacity: 1;
            }
            .custom-cursor.grow {
                width: 48px;
                height: 48px;
                margin: -24px 0 0 -24px;
            }
        }
    </style>
</head>

        const USE_OPTIMIZED = true;

        function fileUrl(category, name, kind) {
            const c = encodeURIComponent(category);
            const n = encodeURIComponent(name);
            if (!USE_OPTIMIZED) return `${c}/${n}.jpg`;
            return kind === 'thumb' ? `${c}/thumbs/${n}.webp` : `${c}/webp/${n}.webp`;
        }

        // How wide one column is on screen, so the browser picks the right file
        function columnSizes(columnCount) {
            if (columnCount === 1) return 'calc(100vw - 3rem)';
            if (columnCount === 2) return 'calc((100vw - 6.5rem) / 2)';
            return 'calc((min(100vw, 1800px) - 13rem) / 3)';
        }

        const gridContainer = document.getElementById('gallery-grid');
        const tabsContainer = document.getElementById('tabs');

        // ===== Custom circular inverted cursor (desktop / mouse only) =====
        const isDesktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        if (isDesktopPointer) {
            const cursorDot = document.createElement('div');
            cursorDot.className = 'custom-cursor';
            document.body.appendChild(cursorDot);

            // Move with transform, at most once per frame (no layout work)
            let cursorX = 0,
                cursorY = 0,
                cursorQueued = false;
            window.addEventListener('mousemove', (e) => {
                cursorX = e.clientX;
                cursorY = e.clientY;
                if (!cursorQueued) {
                    cursorQueued = true;
                    requestAnimationFrame(() => {
                        cursorDot.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
                        cursorQueued = false;
                    });
                }
                cursorDot.classList.add('active');
            }, {
                passive: true
            });

            document.addEventListener('mouseleave', () => cursorDot.classList.remove('active'));
            document.addEventListener('mouseenter', () => cursorDot.classList.add('active'));

            document.addEventListener('mouseover', (e) => {
                if (e.target.closest('a, button, .tab-btn, .masonry-item, .pager-btn')) {
                    cursorDot.classList.add('grow');
                }
            });

            document.addEventListener('mouseout', (e) => {
                if (e.target.closest('a, button, .tab-btn, .masonry-item, .pager-btn')) {
                    cursorDot.classList.remove('grow');
                }
            });
        }

        // ===== Lightbox state & elements =====
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');
        const lightboxPrev = document.getElementById('lightbox-prev');
        const lightboxNext = document.getElementById('lightbox-next');

        let currentImageList = []; // { src, alt } in numeric order, for lightbox navigation
        let currentImageIndex = 0;

        function openLightbox(index) {
            if (!currentImageList.length) return;
            currentImageIndex = (index + currentImageList.length) % currentImageList.length;
            const item = currentImageList[currentImageIndex];
            lightboxImg.src = item.src;
            lightboxImg.alt = item.alt;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';

            // Fetch the previous and next images in the background so arrows feel instant
            [1, -1].forEach(step => {
                const n = currentImageList[(currentImageIndex + step + currentImageList.length) % currentImageList.length];
                const pre = new Image();
                pre.decoding = 'async';
                pre.src = n.src;
            });
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        function showNextImage() {
            openLightbox(currentImageIndex + 1);
        }

        function showPrevImage() {
            openLightbox(currentImageIndex - 1);
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxNext.addEventListener('click', showNextImage);
        lightboxPrev.addEventListener('click', showPrevImage);

        // Click outside the image (on the dark backdrop) also closes it
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        lightboxImg.addEventListener('click', closeLightbox);

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNextImage();
            if (e.key === 'ArrowLeft') showPrevImage();
        });

        // ===== Layout helpers =====

        // Numeric filename order: 1, 2, ... 10, "10 A", 11 ...
        // (JS objects put integer-like keys first, so "10 A" must be sorted explicitly)
        function numericOrder(images) {
            return Object.keys(images).sort((a, b) => (parseInt(a, 10) - parseInt(b, 10)) || (a.length - b.length));
        }

        function dims(images, name) {
            const [w, h] = images[name].split('x').map(Number);
            return {
                w,
                h
            };
        }

        // Must match the CSS breakpoints
        function getColumnCount() {
            if (window.innerWidth <= 640) return 1;
            if (window.innerWidth <= 1024) return 2;
            return 3;
        }

        // Returns an array of columns, each an array of image names
        function buildColumns(category, columnCount) {
            const data = galleryData[category];
            const order = numericOrder(data.images);

            if (columnCount === 3) return data.layout3; // precomputed balanced layout
            if (columnCount === 1) return [order];

            // 2 columns: place each image (in numeric order) into the shorter column.
            // Near-ties go to the left column so images still read left-to-right.
            const cols = Array.from({
                length: columnCount
            }, () => []);
            const heights = new Array(columnCount).fill(0);
            order.forEach(name => {
                const {
                    w,
                    h
                } = dims(data.images, name);
                const min = Math.min(...heights);
                const target = heights.findIndex(v => v - min < 0.05);
                cols[target].push(name);
                heights[target] += h / w;
            });
            return cols;
        }

        let currentCategory = null;
        let currentColumnCount = getColumnCount();

        // Builds the grid for a category immediately
        function renderCategory(categoryName) {
            currentCategory = categoryName;
            gridContainer.innerHTML = '';
            currentColumnCount = getColumnCount();

            const data = galleryData[categoryName];
            const order = numericOrder(data.images);
            const sizes = columnSizes(currentColumnCount);

            // Lightbox steps through images in numeric order (full-size files)
            currentImageList = order.map(name => ({
                src: fileUrl(categoryName, name, 'full'),
                alt: `${categoryName} ${name}`
            }));

            const fragment = document.createDocumentFragment();

            buildColumns(categoryName, currentColumnCount).forEach(columnNames => {
                const col = document.createElement('div');
                col.className = 'masonry-col';

                columnNames.forEach((name, row) => {
                    const {
                        w,
                        h
                    } = dims(data.images, name);
                    const index = order.indexOf(name);

                    const wrapper = document.createElement('div');
                    wrapper.className = 'masonry-item';

                    const img = document.createElement('img');
                    img.width = w; // reserves correct space before the image loads
                    img.height = h;
                    img.alt = currentImageList[index].alt;
                    img.decoding = 'async';

                    // Top of the page loads right away; everything below waits until scrolled near
                    if (row === 0) {
                        img.loading = 'eager';
                        img.fetchPriority = 'high';
                    } else if (row === 1) {
                        img.loading = 'eager';
                    } else {
                        img.loading = 'lazy';
                    }

                    if (USE_OPTIMIZED) {
                        img.srcset = `${fileUrl(categoryName, name, 'thumb')} 800w, ${fileUrl(categoryName, name, 'full')} 1400w`;
                        img.sizes = sizes;
                    }
                    img.src = USE_OPTIMIZED ? fileUrl(categoryName, name, 'thumb') : currentImageList[index].src;

                    img.addEventListener('click', () => openLightbox(index));

                    wrapper.appendChild(img);
                    col.appendChild(wrapper);
                });

                fragment.appendChild(col);
            });

            gridContainer.appendChild(fragment); // one DOM update instead of dozens

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.target === categoryName);
            });

            updatePager();
        }

        // Switches category with the fade transition
        function loadCategory(categoryName) {
            currentCategory = categoryName;
            gridContainer.classList.add('fading');

            setTimeout(() => {
                renderCategory(categoryName);
                gridContainer.classList.remove('fading');
            }, 300);
        }

        // Re-layout when the window crosses a breakpoint (3 <-> 2 <-> 1 columns)
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (currentCategory && getColumnCount() !== currentColumnCount) {
                    loadCategory(currentCategory);
                }
            }, 150);
        }, {
            passive: true
        });

        // ===== End-of-page previous / next gallery buttons =====
        const pagerPrev = document.getElementById('pager-prev');
        const pagerNext = document.getElementById('pager-next');

        // Neighbouring category, wrapping around at either end
        function neighbourCategory(step) {
            const categories = Object.keys(galleryData);
            const i = categories.indexOf(currentCategory);
            return categories[(i + step + categories.length) % categories.length];
        }

        function updatePager() {
            const prev = neighbourCategory(-1);
            const next = neighbourCategory(1);
            document.getElementById('pager-prev-label').textContent = prev;
            document.getElementById('pager-next-label').textContent = next;
            pagerPrev.setAttribute('aria-label', `Previous gallery: ${prev}`);
            pagerNext.setAttribute('aria-label', `Next gallery: ${next}`);
        }

        function switchCategory(step) {
            const target = neighbourCategory(step);
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            loadCategory(target);

            // keep the chosen tab in view in the header
            const tab = document.querySelector(`.tab-btn[data-target="${target}"]`);
            if (tab) tab.scrollIntoView({
                block: 'nearest',
                inline: 'center'
            });
        }

        pagerPrev.addEventListener('click', () => switchCategory(-1));
        pagerNext.addEventListener('click', () => switchCategory(1));

        // Initialize tabs and click events
        function initGallery() {
            Object.keys(galleryData).forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.innerText = category;
                btn.dataset.target = category;

                btn.addEventListener('click', () => {
                    if (!btn.classList.contains('active')) {
                        loadCategory(category);
                    }
                });

                tabsContainer.appendChild(btn);
            });

            renderCategory('Landscape'); // first load: no fade delay
        }

        // The script sits at the end of <body>, so the page is ready: start now
        initGallery();
    </script>

    <!-- Fluid Sidebar Script -->
    <script src="../Sidebar/sidebar-widget.js" defer></script>
</body>

</html>
