<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Justified Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Justified Flexbox Container */
    .gallery-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Each image container */
    .gallery-item {
      height: 240px; /* Base row height */
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background-color: #222;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      vertical-align: middle;
      transition: transform 0.25s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.03);
    }

    /* Prevents the final row from stretching wildly across the entire width */
    .last-row-spacer {
      flex-grow: 10;
      height: 0;
    }

    /* Smaller heights on mobile so rows don't get dominated by one portrait */
    @media (max-width: 600px) {
      .gallery-item {
        height: 160px;
      }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
