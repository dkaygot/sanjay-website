<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Field Notes — A simple blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0e0e0f;
            --bg-alt: #151516;
            --card: #1b1b1d;
            --border: #2d2d30;
            --body: #d9d6d0;
            --muted: #9a978f;
            --heading: #f4f1ea;
            --accent: #c9a96a;
            --glow: #222224;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--body);
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.65;
        }
        
        h1,
        h2,
        h3 {
            font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            color: var(--heading);
            font-weight: 600;
            line-height: 1.15;
            margin: 0;
        }
        
        a {
            color: var(--accent);
        }
        
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }
        
        .hero {
            background: radial-gradient(ellipse at top, var(--glow) 0%, var(--bg) 70%);
            padding: 88px 0 72px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: clamp(2.6rem, 7vw, 4.4rem);
        }
        
        .hero p {
            color: var(--muted);
            max-width: 480px;
            margin: 18px auto 0;
            font-size: 1.05rem;
        }
        
        .rule {
            width: 56px;
            height: 2px;
            background: var(--accent);
            margin: 28px auto 0;
            border: 0;
        }
        
        section {
            padding: 72px 0;
        }
        
        section.alt {
            background: var(--bg-alt);
            border-top: 1px solid var(--border);
        }
        
        .section-head {
            margin-bottom: 36px;
        }
        
        .section-head h2 {
            font-size: 2.2rem;
        }
        
        .section-head p {
            color: var(--muted);
            margin: 8px 0 0;
        }
        /* Posts */
        
        .wrap.narrow {
            max-width: 840px;
        }

        .posts {
            display: grid;
            gap: 28px;
        }

        .post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 44px 48px 40px;
            overflow: hidden;
        }
        /* Post photos */

        .photo-btn {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: #000;
            cursor: zoom-in;
            overflow: hidden;
        }

        .photo-btn img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .5s ease, opacity .3s;
        }

        .photo-btn:hover img {
            transform: scale(1.025);
        }

        .post-cover {
            margin: -44px -48px 34px;
        }

        .post-cover .photo-btn img {
            height: auto;
            max-height: 560px;
        }

        .post-cover figcaption,
        .post-gallery figcaption {
            color: var(--muted);
            font-size: .84rem;
            font-style: italic;
        }

        .post-cover figcaption {
            padding: 10px 48px 0;
        }

        .post-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            margin-top: 34px;
        }

        .post-gallery[data-count="2"] {
            grid-template-columns: 1fr 1fr;
        }

        .post-gallery[data-count="1"] {
            grid-template-columns: 1fr;
        }

        .post-gallery figure {
            margin: 0;
            display: grid;
            gap: 6px;
            align-content: start;
        }

        .post-gallery .photo-btn {
            aspect-ratio: 4 / 3;
            border-radius: 6px;
        }

        .post-gallery[data-count="1"] .photo-btn {
            aspect-ratio: auto;
        }

        .post-gallery[data-count="1"] .photo-btn img {
            height: auto;
            max-height: 560px;
        }
        /* Attached documents */

        .post-files {
            display: grid;
            gap: 10px;
            margin-top: 34px;
        }

        .post-files-title {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 500;
            letter-spacing: .16em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .file-card {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            overflow: hidden;
            transition: border-color .2s;
        }

        .file-card:hover {
            border-color: var(--accent);
        }

        .file-open {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            color: inherit;
            text-decoration: none;
        }

        .file-ext {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: #0e0e0f;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .06em;
        }

        .file-ext.is-doc {
            background: #7fa6d9;
        }

        .file-meta {
            min-width: 0;
            display: grid;
            gap: 2px;
        }

        .file-name {
            color: var(--heading);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-sub {
            color: var(--muted);
            font-size: .8rem;
        }

        .file-arrow {
            margin-left: auto;
            padding-left: 8px;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .file-dl {
            flex: none;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-left: 1px solid var(--border);
            color: var(--muted);
            font-size: .82rem;
            text-decoration: none;
            transition: color .2s, background .2s;
        }

        .file-dl:hover {
            color: var(--heading);
            background: rgba(255, 255, 255, .03);
        }
        /* Lightbox */

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2147483640;
            display: grid;
            grid-template-columns: 64px 1fr 64px;
            align-items: center;
            background: rgba(6, 6, 7, .96);
        }

        .lightbox[hidden] {
            display: none;
        }

        .lightbox figure {
            grid-column: 2;
            margin: 0;
            display: grid;
            justify-items: center;
            gap: 12px;
            min-width: 0;
        }

        .lightbox img {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 120px);
            object-fit: contain;
        }

        .lightbox figcaption {
            color: var(--body);
            font-size: .92rem;
            text-align: center;
            max-width: 70ch;
        }

        .lb-count {
            color: var(--muted);
            font-size: .8rem;
            letter-spacing: .08em;
        }

        .lb-btn {
            border: 0;
            background: transparent;
            color: var(--heading);
            font-size: 2.6rem;
            line-height: 1;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            justify-self: center;
            transition: background .2s;
        }

        .lb-btn:hover {
            background: rgba(255, 255, 255, .08);
        }

        .lb-close {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 2rem;
        }

        .lb-prev {
            grid-column: 1;
            grid-row: 1;
        }

        .lb-next {
            grid-column: 3;
            grid-row: 1;
        }

        .lightbox.single .lb-prev,
        .lightbox.single .lb-next {
            visibility: hidden;
        }

        .photos-field {
            display: grid;
            gap: 6px;
            font-size: .9rem;
            color: var(--muted);
        }

        .post-cat {
            display: inline-block;
            color: var(--accent);
            font-size: .72rem;
            font-weight: 500;
            letter-spacing: .16em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .post h3 {
            font-size: clamp(2rem, 4.4vw, 2.9rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -.005em;
            text-wrap: balance;
            margin-bottom: 16px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            color: var(--muted);
            font-size: .88rem;
            padding-bottom: 22px;
            margin-bottom: 26px;
            border-bottom: 1px solid var(--border);
        }

        .meta .author {
            color: var(--body);
            font-weight: 500;
        }

        .meta .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--muted);
            opacity: .7;
        }

        .post-body {
            font-size: 1.08rem;
            line-height: 1.8;
            color: var(--body);
            max-width: 68ch;
        }

        .post-body p {
            margin: 0 0 1.15em;
            white-space: pre-line;
        }

        .post-body p:last-child {
            margin-bottom: 0;
        }

        .post-body p:first-child::first-letter {
            float: left;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 3.6em;
            line-height: .85;
            font-weight: 600;
            color: var(--accent);
            padding: 6px 10px 0 0;
        }
        
        .empty {
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 28px;
            text-align: center;
        }
        /* Form */
        
        form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px;
            display: grid;
            gap: 18px;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        label {
            display: grid;
            gap: 6px;
            font-size: .9rem;
            color: var(--muted);
        }
        
        input,
        textarea {
            font: inherit;
            color: var(--body);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            width: 100%;
            transition: border-color .2s;
        }
        
        input:hover,
        textarea:hover {
            border-color: #3d3d41;
        }
        
        input:focus,
        textarea:focus {
            border-color: var(--accent);
            outline: none;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn {
            justify-self: start;
            background: var(--accent);
            color: #0e0e0f;
            border: 0;
            border-radius: 6px;
            padding: 12px 26px;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: filter .2s;
        }
        
        .btn:hover {
            filter: brightness(1.1);
        }
        
        .status {
            font-size: .9rem;
            color: var(--accent);
            min-height: 1.2em;
        }
        
        .error {
            color: #c0574a;
        }

        .hp {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .btn[disabled] {
            opacity: .6;
            cursor: wait;
        }
        
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
            .hero {
                padding: 64px 0 52px;
            }
            section {
                padding: 52px 0;
            }
            .post {
                padding: 28px 22px 26px;
            }
            .post-cover {
                margin: -28px -22px 26px;
            }
            .post-cover figcaption {
                padding: 8px 22px 0;
            }
            .post-gallery,
            .post-gallery[data-count="2"] {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .post-gallery[data-count="1"] {
                grid-template-columns: 1fr;
            }
            .file-open {
                gap: 12px;
                padding: 10px 12px;
            }
            .file-arrow {
                display: none;
            }
            .file-dl {
                padding: 0 12px;
            }
            .lightbox {
                grid-template-columns: 1fr;
                padding: 0 8px;
            }
            .lightbox figure {
                grid-column: 1;
                grid-row: 1;
            }
            .lb-prev,
            .lb-next {
                position: relative;
                z-index: 1;
                grid-row: 1;
                grid-column: 1;
                align-self: end;
                margin-bottom: 18px;
                background: rgba(0, 0, 0, .5);
            }
            .lb-prev {
                justify-self: start;
            }
            .lb-next {
                justify-self: end;
            }
            .post-body {
                font-size: 1.02rem;
                line-height: 1.75;
            }
            .post-body p:first-child::first-letter {
                font-size: 3.1em;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="hero" id="top">
        <div class="wrap">
            <h1>Field Notes</h1>
            <p>Short posts on things worth writing down. Read the latest below, or add your own.</p>
            <hr class="rule">
        </div>
    </div>

    <section id="posts">
        <div class="wrap narrow">
            <div class="section-head">
                <h2>Latest posts</h2>
                <p id="count"></p>
            </div>
            <div class="posts" id="postList"></div>
        </div>
    </section>

    <section class="alt" id="write">
        <div class="wrap narrow">
            <div class="section-head">
                <h2>Write a post</h2>
                <p>Send in your post and it appears in the list once it has been reviewed.</p>
            </div>
            <form id="postForm" novalidate>
                <!-- left empty by people; bots that fill every field get dropped -->
                <div class="hp" aria-hidden="true">
                    <label>Website <input name="website" type="text" tabindex="-1" autocomplete="off"></label>
                </div>
                <div class="row">
                    <label>Title
          <input id="title" name="title" type="text" maxlength="90" required>
        </label>
                    <label>Your name
          <input id="author" name="author" type="text" maxlength="50" required>
        </label>
                </div>
                <label>Post
        <textarea id="body" name="body" required></textarea>
      </label>
                <div class="photos-field">
                    <span>Photos (optional)</span>
                    <div id="photoPicker"></div>
                </div>
                <div class="photos-field">
                    <span>Documents (optional)</span>
                    <div id="filePicker"></div>
                </div>
                <div class="status" id="status" role="status"></div>
                <button class="btn" type="submit" id="submitBtn">Send for review</button>
            </form>
        </div>
    </section>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <button class="lb-btn lb-close" type="button" id="lbClose" aria-label="Close">&times;</button>
        <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="Previous photo">&lsaquo;</button>
        <figure>
            <img id="lbImg" alt="">
            <figcaption id="lbCap"></figcaption>
            <div class="lb-count" id="lbCount"></div>
        </figure>
        <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="Next photo">&rsaquo;</button>
    </div>

    <script src="../js/site-store.js"></script>
    <script src="../js/photo-picker.js"></script>
    <script>
        (function() {
            var API = "/api/api";
            var posts = [];
            var list = document.getElementById("postList");
            var count = document.getElementById("count");
            var form = document.getElementById("postForm");
            var writeSection = document.getElementById("write");
            var status = document.getElementById("status");
            var submitBtn = document.getElementById("submitBtn");
            var picker = window.PhotoPicker ? window.PhotoPicker.create(document.getElementById("photoPicker"), {
                max: 4
            }) : null;

            var docPicker = window.FilePicker ? window.FilePicker.create(document.getElementById("filePicker"), {
                max: 2
            }) : null;

            /* ---------- Attached documents ---------- */
            function docKind(name) {
                var m = /\.(pdf|docx?)$/i.exec(name || "");
                return m ? m[1].toLowerCase() : "";
            }

            function fileUrl(f, download) {
                if (window.SiteStore) return window.SiteStore.fileUrl(f, API, download);
                return f.src || API + "?action=file&id=" + encodeURIComponent(f.id) + (download ? "&download=1" : "");
            }

            // Microsoft's free viewer can only fetch files from a public site, not from localhost
            var publicSite = location.protocol === "https:" &&
                !/^(localhost|127\.|0\.0\.0\.0|\[::1\]|10\.|192\.168\.)/.test(location.hostname);

            // a PDF opens in the browser's own viewer; a Word file in Microsoft's online viewer
            function openHref(f) {
                var url = fileUrl(f);
                if (docKind(f.name) === "pdf" || !publicSite) return url;
                return "https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(new URL(url, location.href).href);
            }

            // a document kept only in this browser (local mode) is a data URL, which tabs refuse to open directly
            function openLocal(f) {
                var cut = f.src.indexOf(",");
                var bin = atob(f.src.slice(cut + 1));
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                var type = f.src.slice(5, f.src.indexOf(";")) || "application/octet-stream";
                window.open(URL.createObjectURL(new Blob([bytes], {
                    type: type
                })), "_blank", "noopener");
            }

            function fileCard(f) {
                var kind = docKind(f.name) || "file";
                var card = document.createElement("div");
                card.className = "file-card";

                var open = document.createElement("a");
                open.className = "file-open";
                open.href = f.src ? "#" : openHref(f);
                open.target = "_blank";
                open.rel = "noopener";
                if (f.src) open.addEventListener("click", function(e) {
                    e.preventDefault();
                    openLocal(f);
                });

                var ext = document.createElement("span");
                ext.className = "file-ext" + (kind === "pdf" ? "" : " is-doc");
                ext.textContent = kind.toUpperCase();
                var meta = document.createElement("span");
                meta.className = "file-meta";
                var name = document.createElement("span");
                name.className = "file-name";
                name.textContent = f.name;
                name.title = f.name;
                var sub = document.createElement("span");
                sub.className = "file-sub";
                var size = window.FilePicker ? window.FilePicker.formatSize(f.size) : "";
                sub.textContent = (size ? size + " · " : "") + "Opens in a new tab";
                meta.append(name, sub);
                var arrow = document.createElement("span");
                arrow.className = "file-arrow";
                arrow.setAttribute("aria-hidden", "true");
                arrow.textContent = "↗";
                open.append(ext, meta, arrow);

                var dl = document.createElement("a");
                dl.className = "file-dl";
                dl.href = fileUrl(f, true);
                dl.setAttribute("download", f.name);
                dl.setAttribute("aria-label", "Download " + f.name);
                dl.textContent = "Download";

                card.append(open, dl);
                return card;
            }

            function imageUrl(img) {
                if (window.SiteStore) return window.SiteStore.imageUrl(img, API);
                return img.src || API + "?action=image&id=" + encodeURIComponent(img.id);
            }

            /* ---------- Lightbox ---------- */
            var lb = document.getElementById("lightbox");
            var lbImg = document.getElementById("lbImg");
            var lbCap = document.getElementById("lbCap");
            var lbCount = document.getElementById("lbCount");
            var lbList = [];
            var lbIndex = 0;
            var lbReturnFocus = null;

            function lbShow(i) {
                lbIndex = (i + lbList.length) % lbList.length;
                var item = lbList[lbIndex];
                lbImg.src = item.src;
                lbImg.alt = item.alt;
                lbCap.textContent = item.caption;
                lbCap.hidden = !item.caption;
                lbCount.textContent = lbList.length > 1 ? (lbIndex + 1) + " / " + lbList.length : "";
            }

            function openLightbox(list, i) {
                lbList = list;
                lbReturnFocus = document.activeElement;
                lb.classList.toggle("single", list.length < 2);
                lbShow(i);
                lb.hidden = false;
                document.body.style.overflow = "hidden";
                document.getElementById("lbClose").focus();
            }

            function closeLightbox() {
                lb.hidden = true;
                lbImg.removeAttribute("src");
                document.body.style.overflow = "";
                if (lbReturnFocus && lbReturnFocus.focus) lbReturnFocus.focus();
            }

            document.getElementById("lbClose").addEventListener("click", closeLightbox);
            document.getElementById("lbPrev").addEventListener("click", function() {
                lbShow(lbIndex - 1);
            });
            document.getElementById("lbNext").addEventListener("click", function() {
                lbShow(lbIndex + 1);
            });
            lb.addEventListener("click", function(e) {
                if (e.target === lb) closeLightbox();
            });
            document.addEventListener("keydown", function(e) {
                if (lb.hidden) return;
                if (e.key === "Escape") closeLightbox();
                else if (e.key === "ArrowLeft" && lbList.length > 1) lbShow(lbIndex - 1);
                else if (e.key === "ArrowRight" && lbList.length > 1) lbShow(lbIndex + 1);
            });

            // a clickable photo that opens the lightbox at position `i` of `list`
            function photoButton(list, i) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "photo-btn";
                btn.setAttribute("aria-label", "View photo" + (list[i].caption ? ": " + list[i].caption : " " + (i + 1)));
                var img = document.createElement("img");
                img.src = list[i].src;
                img.alt = list[i].alt;
                img.loading = "lazy";
                img.decoding = "async";
                btn.appendChild(img);
                btn.addEventListener("click", function() {
                    openLightbox(list, i);
                });
                return btn;
            }

            function figure(list, i) {
                var f = document.createElement("figure");
                f.appendChild(photoButton(list, i));
                if (list[i].caption) {
                    var c = document.createElement("figcaption");
                    c.textContent = list[i].caption;
                    f.appendChild(c);
                }
                return f;
            }

            // Apply admin settings
            if (window.SiteStore) {
                var settings = window.SiteStore.getSettings();
                if (settings.allowPublicBlogSubmissions === false) {
                    var headP = writeSection.querySelector(".section-head p");
                    if (headP) headP.textContent = "Guest submissions are currently paused by the administrator.";
                    if (form) form.style.display = "none";
                }
            }

            function fmt(d) {
                var dt = new Date(d + "T00:00:00");
                return isNaN(dt) ? d : dt.toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });
            }

            function message(text) {
                list.innerHTML = "";
                var e = document.createElement("div");
                e.className = "empty";
                e.textContent = text;
                list.appendChild(e);
            }

            function render() {
                count.textContent = posts.length + (posts.length === 1 ? " post" : " posts");
                if (!posts.length) return message("No posts yet. Write the first one below.");
                list.innerHTML = "";
                posts.forEach(function(p) {
                    var art = document.createElement("article");
                    art.className = "post";

                    var photos = (p.images || []).map(function(img, i) {
                        return {
                            src: imageUrl(img),
                            caption: img.caption || "",
                            alt: img.caption || p.title + " (photo " + (i + 1) + ")"
                        };
                    });
                    if (photos.length) {
                        var cover = figure(photos, 0);
                        cover.className = "post-cover";
                        art.appendChild(cover);
                    }

                    if (p.category) {
                        var c = document.createElement("span");
                        c.className = "post-cat";
                        c.textContent = p.category;
                        art.appendChild(c);
                    }

                    var h = document.createElement("h3");
                    h.textContent = p.title;

                    var text = String(p.body || "");
                    var words = text.split(/\s+/).filter(Boolean).length;
                    var mins = Math.max(1, Math.round(words / 200));

                    var m = document.createElement("div");
                    m.className = "meta";
                    var metaParts = [];
                    if (p.author) {
                        var a = document.createElement("span");
                        a.className = "author";
                        a.textContent = p.author;
                        metaParts.push(a);
                    }
                    if (p.date) {
                        var t = document.createElement("time");
                        t.dateTime = p.date;
                        t.textContent = fmt(p.date);
                        metaParts.push(t);
                    }
                    var r = document.createElement("span");
                    r.textContent = mins + " min read";
                    metaParts.push(r);
                    metaParts.forEach(function(el, i) {
                        if (i) {
                            var d = document.createElement("span");
                            d.className = "dot";
                            d.setAttribute("aria-hidden", "true");
                            m.appendChild(d);
                        }
                        m.appendChild(el);
                    });

                    var b = document.createElement("div");
                    b.className = "post-body";
                    text.trim().split(/\n\s*\n/).forEach(function(para) {
                        var pe = document.createElement("p");
                        pe.textContent = para.trim();
                        b.appendChild(pe);
                    });

                    art.append(h, m, b);

                    if (photos.length > 1) {
                        var gallery = document.createElement("div");
                        gallery.className = "post-gallery";
                        gallery.dataset.count = String(photos.length - 1);
                        for (var gi = 1; gi < photos.length; gi++) gallery.appendChild(figure(photos, gi));
                        art.appendChild(gallery);
                    }

                    if (p.files && p.files.length) {
                        var files = document.createElement("div");
                        files.className = "post-files";
                        var ft = document.createElement("div");
                        ft.className = "post-files-title";
                        ft.textContent = p.files.length === 1 ? "Attachment" : "Attachments";
                        files.appendChild(ft);
                        p.files.forEach(function(f) {
                            files.appendChild(fileCard(f));
                        });
                        art.appendChild(files);
                    }

                    list.appendChild(art);
                });
            }

            // Load posts with automatic offline / local storage fallback
            function load() {
                message("Loading posts…");
                fetch(API + "?action=public_posts", {
                    cache: "no-store"
                }).then(function(r) {
                    return r.json();
                }).then(function(res) {
                    if (!res.ok) throw new Error(res.error);
                    posts = res.posts || [];
                    // If server returns empty list, check local approved posts
                    if (!posts.length && window.SiteStore) {
                        var localApproved = window.SiteStore.getPosts("approved");
                        if (localApproved && localApproved.length) {
                            posts = localApproved;
                        }
                    }
                    render();
                }).catch(function() {
                    // Fallback to local storage store
                    if (window.SiteStore) {
                        posts = window.SiteStore.getPosts("approved");
                        render();
                    } else {
                        count.textContent = "";
                        message("Posts couldn't be loaded right now. Please try again later.");
                    }
                });
            }

            function setStatus(text, isError) {
                status.textContent = text;
                status.classList.toggle("error", !!isError);
            }

            form.addEventListener("submit", function(ev) {
                ev.preventDefault();
                var title = form.title.value.trim();
                var author = form.author.value.trim();
                var body = form.body.value.trim();
                if (!title || !author || !body) {
                    setStatus("Add a title, your name, and the post text.", true);
                    return;
                }
                submitBtn.disabled = true;
                if (picker) picker.setBusy(true);
                if (docPicker) docPicker.setBusy(true);
                setStatus("Sending…");

                var images = [];
                var files = [];
                var photos = picker && picker.count() ? picker.uploadAll(function(n, total) {
                    setStatus("Uploading photo " + n + " of " + total + "…");
                }) : Promise.resolve([]);

                photos.then(function(list) {
                    images = list;
                    return docPicker && docPicker.count() ? docPicker.uploadAll(function(n, total) {
                        setStatus("Uploading document " + n + " of " + total + "…");
                    }) : [];
                }).then(function(list) {
                    files = list;
                    setStatus("Sending…");
                    return fetch(API + "?action=submit_post", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: title,
                            author: author,
                            body: body,
                            images: images.map(function(im) {
                                return {
                                    id: im.id,
                                    caption: im.caption
                                };
                            }),
                            files: files.map(function(f) {
                                return {
                                    id: f.id
                                };
                            }),
                            website: form.website.value
                        })
                    }).then(function(r) {
                        return r.json().catch(function() {
                            return null;
                        });
                    }, function() {
                        return null; // no server reachable
                    });
                }).then(function(res) {
                    if (res && res.ok) return;
                    if (res && res.error) throw new Error(res.error);
                    // no API here (local preview / offline): keep the post in this browser for the admin page
                    if (!window.SiteStore) throw new Error("Your post couldn't be sent right now. Please try again later.");
                    return window.SiteStore.addPost({
                        title: title,
                        author: author,
                        body: body,
                        images: images,
                        files: files,
                        category: "Guest Submission",
                        status: "pending"
                    }, {
                        localOnly: true
                    });
                }).then(function() {
                    form.reset();
                    if (picker) picker.reset();
                    if (docPicker) docPicker.reset();
                    setStatus("Thank you! Your post has been sent and will appear here once it's approved by admin.");
                }).catch(function(err) {
                    setStatus(err.message || "Your post couldn't be sent. Please try again.", true);
                }).then(function() {
                    submitBtn.disabled = false;
                    if (picker) picker.setBusy(false);
                    if (docPicker) docPicker.setBusy(false);
                });
            });

            load();
        })();
    </script>
    <script src="../Sidebar/sidebar-widget.js"></script>
</body>

</html>
