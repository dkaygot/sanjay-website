<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Field Notes — A simple blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0e0e0f;
            --bg-alt: #151516;
            --card: #1b1b1d;
            --border: #2d2d30;
            --body: #d9d6d0;
            --muted: #9a978f;
            --heading: #f4f1ea;
            --accent: #c9a96a;
            --glow: #222224;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--body);
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.65;
        }
        
        h1,
        h2,
        h3 {
            font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            color: var(--heading);
            font-weight: 600;
            line-height: 1.15;
            margin: 0;
        }
        
        a {
            color: var(--accent);
        }
        
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }
        
        .hero {
            background: radial-gradient(ellipse at top, var(--glow) 0%, var(--bg) 70%);
            padding: 88px 0 72px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: clamp(2.6rem, 7vw, 4.4rem);
        }
        
        .hero p {
            color: var(--muted);
            max-width: 480px;
            margin: 18px auto 0;
            font-size: 1.05rem;
        }
        
        .rule {
            width: 56px;
            height: 2px;
            background: var(--accent);
            margin: 28px auto 0;
            border: 0;
        }
        
        section {
            padding: 72px 0;
        }
        
        section.alt {
            background: var(--bg-alt);
            border-top: 1px solid var(--border);
        }
        
        .section-head {
            margin-bottom: 36px;
        }
        
        .section-head h2 {
            font-size: 2.2rem;
        }
        
        .section-head p {
            color: var(--muted);
            margin: 8px 0 0;
        }
        /* Posts */
        
        .posts {
            display: grid;
            gap: 20px;
        }
        
        .post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px;
        }
        
        .post h3 {
            font-size: 1.7rem;
            margin-bottom: 6px;
        }
        
        .meta {
            color: var(--muted);
            font-size: .85rem;
            margin-bottom: 14px;
        }
        
        .post p {
            margin: 0;
            white-space: pre-line;
        }
        
        .empty {
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 28px;
            text-align: center;
        }
        /* Form */
        
        form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px;
            display: grid;
            gap: 18px;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        label {
            display: grid;
            gap: 6px;
            font-size: .9rem;
            color: var(--muted);
        }
        
        input,
        textarea {
            font: inherit;
            color: var(--body);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            width: 100%;
            transition: border-color .2s;
        }
        
        input:hover,
        textarea:hover {
            border-color: #3d3d41;
        }
        
        input:focus,
        textarea:focus {
            border-color: var(--accent);
            outline: none;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn {
            justify-self: start;
            background: var(--accent);
            color: #0e0e0f;
            border: 0;
            border-radius: 6px;
            padding: 12px 26px;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: filter .2s;
        }
        
        .btn:hover {
            filter: brightness(1.1);
        }
        
        .status {
            font-size: .9rem;
            color: var(--accent);
            min-height: 1.2em;
        }
        
        .error {
            color: #c0574a;
        }

        .hp {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .btn[disabled] {
            opacity: .6;
            cursor: wait;
        }
        
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
            .hero {
                padding: 64px 0 52px;
            }
            section {
                padding: 52px 0;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="hero" id="top">
        <div class="wrap">
            <h1>Field Notes</h1>
            <p>Short posts on things worth writing down. Read the latest below, or add your own.</p>
            <hr class="rule">
        </div>
    </div>

    <section id="posts">
        <div class="wrap">
            <div class="section-head">
                <h2>Latest posts</h2>
                <p id="count"></p>
            </div>
            <div class="posts" id="postList"></div>
        </div>
    </section>

    <section class="alt" id="write">
        <div class="wrap">
            <div class="section-head">
                <h2>Write a post</h2>
                <p>Send in your post and it appears in the list once it has been reviewed.</p>
            </div>
            <form id="postForm" novalidate>
                <!-- left empty by people; bots that fill every field get dropped -->
                <div class="hp" aria-hidden="true">
                    <label>Website <input name="website" type="text" tabindex="-1" autocomplete="off"></label>
                </div>
                <div class="row">
                    <label>Title
          <input id="title" name="title" type="text" maxlength="90" required>
        </label>
                    <label>Your name
          <input id="author" name="author" type="text" maxlength="50" required>
        </label>
                </div>
                <label>Post
        <textarea id="body" name="body" required></textarea>
      </label>
                <div class="status" id="status" role="status"></div>
                <button class="btn" type="submit" id="submitBtn">Send for review</button>
            </form>
        </div>
    </section>

    <script src="../js/site-store.js"></script>
    <script>
        (function() {
            var API = "/api/api";
            var posts = [];
            var list = document.getElementById("postList");
            var count = document.getElementById("count");
            var form = document.getElementById("postForm");
            var writeSection = document.getElementById("write");
            var status = document.getElementById("status");
            var submitBtn = document.getElementById("submitBtn");

            // Apply admin settings
            if (window.SiteStore) {
                var settings = window.SiteStore.getSettings();
                if (settings.allowPublicBlogSubmissions === false) {
                    var headP = writeSection.querySelector(".section-head p");
                    if (headP) headP.textContent = "Guest submissions are currently paused by the administrator.";
                    if (form) form.style.display = "none";
                }
            }

            function fmt(d) {
                var dt = new Date(d + "T00:00:00");
                return isNaN(dt) ? d : dt.toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });
            }

            function message(text) {
                list.innerHTML = "";
                var e = document.createElement("div");
                e.className = "empty";
                e.textContent = text;
                list.appendChild(e);
            }

            function render() {
                count.textContent = posts.length + (posts.length === 1 ? " post" : " posts");
                if (!posts.length) return message("No posts yet. Write the first one below.");
                list.innerHTML = "";
                posts.forEach(function(p) {
                    var art = document.createElement("article");
                    art.className = "post";

                    var h = document.createElement("h3");
                    h.textContent = p.title;
                    var m = document.createElement("div");
                    m.className = "meta";
                    var catTag = p.category ? " • " + p.category : "";
                    m.textContent = "By " + p.author + " on " + fmt(p.date) + catTag;
                    var b = document.createElement("p");
                    b.textContent = p.body;

                    art.append(h, m, b);
                    list.appendChild(art);
                });
            }

            // Load posts with automatic offline / local storage fallback
            function load() {
                message("Loading posts…");
                fetch(API + "?action=public_posts", {
                    cache: "no-store"
                }).then(function(r) {
                    return r.json();
                }).then(function(res) {
                    if (!res.ok) throw new Error(res.error);
                    posts = res.posts || [];
                    render();
                }).catch(function() {
                    // Fallback to local storage store
                    if (window.SiteStore) {
                        posts = window.SiteStore.getPosts("approved");
                        render();
                    } else {
                        count.textContent = "";
                        message("Posts couldn't be loaded right now. Please try again later.");
                    }
                });
            }

            function setStatus(text, isError) {
                status.textContent = text;
                status.classList.toggle("error", !!isError);
            }

            form.addEventListener("submit", function(ev) {
                ev.preventDefault();
                var title = form.title.value.trim();
                var author = form.author.value.trim();
                var body = form.body.value.trim();
                if (!title || !author || !body) {
                    setStatus("Add a title, your name, and the post text.", true);
                    return;
                }
                submitBtn.disabled = true;
                setStatus("Sending…");

                // Save via SiteStore (saves locally and attempts remote server sync)
                if (window.SiteStore) {
                    window.SiteStore.addPost({
                        title: title,
                        author: author,
                        body: body,
                        category: "Guest Submission",
                        status: "pending"
                    });
                }

                fetch(API + "?action=submit_post", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        author: author,
                        body: body,
                        website: form.website.value
                    })
                }).then(function(r) {
                    return r.json().catch(function() {
                        return {};
                    });
                }).then(function(res) {
                    form.reset();
                    setStatus("Thank you! Your post has been sent and will appear here once it's approved by admin.");
                }).catch(function() {
                    // Even if server is offline, SiteStore already saved locally!
                    form.reset();
                    setStatus("Thank you! Your post has been submitted for admin review and will appear once approved.");
                }).then(function() {
                    submitBtn.disabled = false;
                });
            });

            load();
        })();
    </script>
    <script src="../Sidebar/sidebar-widget.js"></script>
</body>

</html>
